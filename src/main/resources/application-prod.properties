server.port=${PORT:8080}

spring.datasource.url=${SUPPLYTRACE_DB_URL:${DB_URL}}
spring.datasource.username=${SUPPLYTRACE_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SUPPLYTRACE_DB_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update

logging.level.root=INFO

supplytrace.crawler.user-agent=${SUPPLYTRACE_USER_AGENT:SupplyTraceBot/1.0}
supplytrace.crawler.timeout-ms=${SUPPLYTRACE_TIMEOUT_MS:12000}

supplytrace.scheduling.scan-delay-ms=${SUPPLYTRACE_SCAN_DELAY_MS:86400000}
supplytrace.scheduling.scan-initial-delay-ms=${SUPPLYTRACE_SCAN_INITIAL_DELAY_MS:60000}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
