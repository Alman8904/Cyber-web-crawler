server.port=8080

spring.datasource.url=jdbc:h2:mem:supplytrace;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

supplytrace.crawler.user-agent=SupplyTraceBot/1.0
supplytrace.crawler.timeout-ms=12000

supplytrace.scheduling.scan-delay-ms=86400000
supplytrace.scheduling.scan-initial-delay-ms=60000
